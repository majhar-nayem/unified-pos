name: Security

# Dependency, container, IaC and secrets scanning (docs/03-implementation-plan.md §9: blocking on high/critical).
# Container images are scanned in _images.yml on every build; this workflow covers the source tree.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 18 * * 1' # Tuesday 04:23 AEST: catches new advisories without a code change
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review (new vulnerable or disallowed dependencies)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  audit:
    name: pnpm audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: pnpm audit --prod --audit-level high

  trivy-fs:
    name: Trivy filesystem (vulnerabilities and secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  iac:
    name: Trivy IaC and Dockerfile misconfiguration (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: infra
          severity: CRITICAL,HIGH
          # Report only until the findings have been triaged; flip to '1' to make it blocking.
          exit-code: '0'

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history and working tree
        run: |
          docker run --rm -v "${PWD}:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --verbose

  codeql:
    name: CodeQL (SAST)
    # Code scanning needs GitHub Advanced Security on private repositories.
    if: github.event.repository.private == false || vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
