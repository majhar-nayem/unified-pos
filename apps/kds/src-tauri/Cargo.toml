[package]
name = "pos-kds"
version = "0.0.0"
description = "Unified POS kitchen display (Tauri 2 shell)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pos_kds_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
